name: Release Packages to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - 'RaptorSheets.Gig'
          - 'RaptorSheets.Stock'
          - 'RaptorSheets.Core'
      version:
        description: 'Version to release (e.g., 1.2.0)'
        required: true
        type: string

jobs:
  check_workflow:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Require unit and live-sheet tests to have passed on main
      id: check
      run: |
        # Gate the publish on BOTH suites having passed on main: the unit tests, and the live-sheet
        # integration tests that actually prove the formulas this library writes are accepted by
        # Google. The integration suite is deliberately not a PR gate (~18 minutes, and flaky by
        # nature), but a release is infrequent and deliberate, so it is the right place to insist.
        #
        # Filtering is load-bearing. The previous version asked for the newest run of dotnet.yml on
        # ANY branch and compared .conclusion to "success", which failed twice for reasons that had
        # nothing to do with the code:
        #   - an in-progress run reports conclusion=null, which is not "success", so a release cut
        #     shortly after a merge failed with "Status: null" and read as a test failure;
        #   - a run on someone's feature branch could decide whether a release off main was allowed.
        # Asking the API for completed runs on main removes both. (GitHub issue #122.)
        failed=0

        for workflow in dotnet.yml integration-tests.yml; do
          latest=$(gh api "repos/${{ github.repository }}/actions/runs?branch=main&status=completed&per_page=50"             --jq "[.workflow_runs[] | select(.path==\".github/workflows/$workflow\")] | first")

          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::No completed run of $workflow found on main. Run it before releasing."
            failed=1
            continue
          fi

          conclusion=$(echo "$latest" | jq -r '.conclusion')
          url=$(echo "$latest" | jq -r '.html_url')

          if [ "$conclusion" != "success" ]; then
            echo "::error::$workflow last completed on main with '$conclusion' - $url"
            failed=1
          else
            echo "$workflow: success - $url"
          fi
        done

        # Surface an in-progress run separately: "still running" is a wait, not a failure, and
        # conflating the two is what made the old message so misleading.
        for workflow in dotnet.yml integration-tests.yml; do
          running=$(gh api "repos/${{ github.repository }}/actions/runs?branch=main&status=in_progress&per_page=50"             --jq "[.workflow_runs[] | select(.path==\".github/workflows/$workflow\")] | length")

          if [ "$running" != "0" ]; then
            echo "::warning::$workflow is currently running on main - this gate used the last completed run."
          fi
        done

        if [ "$failed" -ne 0 ]; then
          echo "Refusing to publish: see the errors above."
          exit 1
        fi

  detect_package:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.detect.outputs.package }}
      version: ${{ steps.detect.outputs.version }}
    steps:
    - name: Detect package from release tag or input
      id: detect
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          TAG_NAME="${{ github.event.release.tag_name }}"
          echo "Processing release tag: $TAG_NAME"
          
          # Extract package and version from tag
          # Expected formats: gig/v1.2.0, gig/1.2.0, stock/v1.2.0, stock/1.2.0, core/v1.2.0, core/1.2.0
          if [[ "$TAG_NAME" == gig/* ]]; then
            PACKAGE="RaptorSheets.Gig"
            VERSION=${TAG_NAME#gig/}
            VERSION=${VERSION#v}  # Remove 'v' prefix if present
          elif [[ "$TAG_NAME" == stock/* ]]; then
            PACKAGE="RaptorSheets.Stock"
            VERSION=${TAG_NAME#stock/}
            VERSION=${VERSION#v}  # Remove 'v' prefix if present
          elif [[ "$TAG_NAME" == core/* ]]; then
            PACKAGE="RaptorSheets.Core"
            VERSION=${TAG_NAME#core/}
            VERSION=${VERSION#v}  # Remove 'v' prefix if present
          else
            echo "Unknown tag format: $TAG_NAME"
            echo "Expected formats: gig/v1.2.0, gig/1.2.0, stock/v1.2.0, stock/1.2.0, core/v1.2.0, core/1.2.0"
            exit 1
          fi
        else
          # Manual workflow dispatch. The version box is free text, so it arrives exactly as typed -
          # unlike the release path above, nothing has stripped a prefix off it yet. Pasting a whole
          # tag ("core/v5.0.2") used to sail through to `dotnet pack -p:PackageVersion=core/v5.0.2`,
          # where the slash makes an invalid NuGet version and restore dies with a bare
          # "MSB4181: RestoreTask returned false but did not log an error" - no mention of the
          # version, which sends you looking at the SDK instead. Normalise here, then reject
          # anything that still is not a version.
          PACKAGE="${{ github.event.inputs.package }}"
          VERSION="${{ github.event.inputs.version }}"

          # Trim whitespace, then accept the same shapes the release tags use.
          VERSION="$(echo "$VERSION" | tr -d '[:space:]')"
          TYPED="$VERSION"

          case "$VERSION" in
            gig/*)   PREFIX="RaptorSheets.Gig";   VERSION=${VERSION#gig/} ;;
            stock/*) PREFIX="RaptorSheets.Stock"; VERSION=${VERSION#stock/} ;;
            core/*)  PREFIX="RaptorSheets.Core";  VERSION=${VERSION#core/} ;;
            *)       PREFIX="" ;;
          esac
          VERSION=${VERSION#v}

          # A tag prefix that disagrees with the chosen package means one of the two is a mistake -
          # picking either silently would publish under the wrong package ID.
          if [ -n "$PREFIX" ] && [ "$PREFIX" != "$PACKAGE" ]; then
            echo "::error::Version '$TYPED' is prefixed for $PREFIX but the selected package is $PACKAGE."
            echo "Pick one: either choose $PREFIX as the package, or enter the version without the prefix."
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TYPED' is not a valid version."
            echo "Enter the version on its own, e.g. 5.0.1 - no package prefix and no leading 'v'."
            exit 1
          fi

          if [ "$TYPED" != "$VERSION" ]; then
            echo "Normalised version input '$TYPED' to '$VERSION'."
          fi
        fi

        echo "package=$PACKAGE" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Releasing: $PACKAGE version $VERSION"

  build:
    needs: [check_workflow, detect_package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Declaring any permissions block sets every unlisted scope to `none`, so
      # checkout's `contents: read` has to be restated here or the clone 403s.
      contents: read
      # Required for Trusted Publishing: lets the job mint the short-lived OIDC
      # token that nuget.org exchanges for a temporary API key. Without it the
      # token request fails silently and the login step yields no key.
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Pack NuGet package
      run: |
        PACKAGE="${{ needs.detect_package.outputs.package }}"
        VERSION="${{ needs.detect_package.outputs.version }}"
        
        echo "Packing $PACKAGE version $VERSION"
        
        dotnet pack $PACKAGE/$PACKAGE.csproj \
          -c Release \
          -p:PackageVersion=$VERSION \
          --output .
          
    # Trusted Publishing: exchange a GitHub OIDC token for a temporary nuget.org
    # API key, replacing the long-lived `nuget_api_key` secret. The key is valid
    # for one hour and is single-use, so this step deliberately sits immediately
    # before the push rather than earlier in the job.
    #
    # Matched by the nuget.org policy on khanjal/RaptorSheets + release-packages.yml.
    # Renaming this workflow file invalidates that policy - update it there first.
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        # nuget.org profile name (KhanJal), NOT an email address.
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: |
        PACKAGE="${{ needs.detect_package.outputs.package }}"
        echo "Pushing $PACKAGE to NuGet..."
        dotnet nuget push "$PACKAGE.*.nupkg" \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json

    - name: Create release summary
      run: |
        echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** ${{ needs.detect_package.outputs.package }}" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ needs.detect_package.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ✅ Successfully published to NuGet" >> $GITHUB_STEP_SUMMARY
