# This workflow will build a .NET project with test coverage and code quality analysis
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Tests

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call: # this is the trigger for the tests job

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Tests
      shell: bash
      # Unit tests only. The live-sheet integration tests moved to integration-tests.yml: they need
      # ~18 minutes serialised, they are flaky by nature (Google's metadata is briefly stale after a
      # tab is regenerated), and this workflow gates both PRs and - via release-packages.yml's
      # check_workflow - every release. A slow, flaky gate is one people learn to route around.
      #
      # No retry loop here either. It existed for network-dependent tests; unit tests are
      # deterministic, so a retry would only hide a real failure.
      run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~Integration" --logger trx --verbosity normal

    - name: Report skipped tests
      if: always()
      shell: bash
      run: |
        # A skipped test is not a failure, so ~100 skipped live-sheet tests look identical to a
        # clean run in the checks UI. Surface the count in the job summary so a config regression
        # is visible without reading the log. Deliberately does NOT fail the build yet: skips are
        # currently non-zero, and failing here would block every PR before the credentials that
        # cause them can be fixed. Once the count is genuinely 0, turn this into a hard failure.
        # Count individual NotExecuted results rather than reading <Counters>. VSTest records a
        # skipped test as outcome="NotExecuted" on its UnitTestResult, but does NOT propagate it
        # into the Counters element - a run with 1 skip still writes notExecuted="0", so both
        # `skipped=` (which is not a TRX attribute at all) and `notExecuted=` report zero. Verified
        # against a real TRX: total="622" executed="621" notExecuted="0" for a run with 1 skip.
        #
        # find -exec, not $(find) in argument position: with no .trx files the command substitution
        # expands to nothing and grep reads stdin instead, hanging the step. This runs
        # `if: always()`, so a build that failed before tests is exactly that case.
        # `|| true` is load-bearing: GitHub runs steps under `bash -eo pipefail`, so with zero
        # matches grep exits 1, pipefail propagates that through wc, and set -e kills the step.
        # The step meant to report skips would fail precisely when there were none.
        skipped=$( { find . -name '*.trx' -exec grep -o 'outcome="NotExecuted"' {} + 2>/dev/null || true; } | wc -l )
        skipped=${skipped:-0}
        {
          echo "## Test skips"
          echo ""
          if [ "$skipped" -eq 0 ]; then
            echo "No tests skipped."
          else
            echo "**$skipped test(s) skipped.** Integration tests skip themselves when credentials"
            echo "or a spreadsheet id are missing, so a non-zero count here means live-sheet"
            echo "coverage did not run - see the \"Check integration test config\" step above."
          fi
        } >> $GITHUB_STEP_SUMMARY
        if [ "$skipped" -ne 0 ]; then
          echo "::warning::$skipped test(s) skipped - live-sheet coverage did not run."
        fi

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/*.trx'
        retention-days: 30

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarCloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@v4
      with:
        path: ./.sonar/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarCloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ./.sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarCloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: bash
      run: |
        ./.sonar/scanner/dotnet-sonarscanner begin \
          /k:"khanjal_RaptorSheets" \
          /o:"ironraptor" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
          /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx" \
          /d:sonar.cpd.exclusions=RaptorSheets.Gig/Entities/**/*.cs \
          /d:sonar.exclusions=RaptorSheets.Core/Entities/Generated/**,RaptorSheets.Gig/Entities/Generated/**,RaptorSheets.Stock/Entities/Generated/**,**/coverage*.xml,**/TestResults/**,**/coverage/**,**/*.coverage \
          /d:sonar.coverage.exclusions=RaptorSheets.Sample.Web/**,assets/**

    - name: Build for SonarCloud
      run: dotnet build --configuration Release

    - name: Test with Coverage for SonarCloud
      shell: bash
      # Unit-only, matching the gating job above. Coverage therefore reflects what the unit suite
      # actually exercises rather than being inflated by live-sheet tests that only run elsewhere.
      run: |
        dotnet test --no-build --configuration Release           --filter "FullyQualifiedName!~Integration"           --collect:"XPlat Code Coverage"           --results-directory ./TestResults           --logger trx           --verbosity normal           -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Upload Coverage Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-results
        path: '**/TestResults/**/coverage.opencover.xml'
        retention-days: 30

    - name: End SonarCloud Scan
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: bash
      run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
