# This workflow will build a .NET project with test coverage and code quality analysis
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Tests

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call: # this is the trigger for the tests job

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Check integration test config
      shell: bash
      env:
        spreadsheets__test__gig: ${{ secrets.GIG_SPREADSHEET_ID }}
        spreadsheets__test__stock: ${{ secrets.STOCK_SPREADSHEET_ID }}
        spreadsheets__test__job: ${{ secrets.JOB_SPREADSHEET_ID }}
        spreadsheets__test__home: ${{ secrets.HOME_SPREADSHEET_ID }}
        spreadsheets__test__core: ${{ secrets.CORE_SPREADSHEET_ID }}
        google_credentials__private_key_id: ${{ secrets.GOOGLE_CREDENTIALS_PRIVATE_KEY_ID }}
        google_credentials__private_key: ${{ secrets.GOOGLE_CREDENTIALS_PRIVATE_KEY }}
        google_credentials__client_email: ${{ secrets.GOOGLE_CREDENTIALS_CLIENT_EMAIL }}
        google_credentials__client_id: ${{ secrets.GOOGLE_CREDENTIALS_CLIENT_ID }}
      run: |
        # Integration tests skip themselves when credentials or a spreadsheet id are missing
        # (FactCheckUserSecretsBaseAttribute), and a skip is not a failure - so an unset secret
        # silently removes ~100 live-sheet tests while CI still reports green. Report presence
        # up front. Values are never printed, only whether they arrived.
        missing=0
        for name in google_credentials__private_key_id google_credentials__private_key                     google_credentials__client_email google_credentials__client_id                     spreadsheets__test__gig spreadsheets__test__stock                     spreadsheets__test__job spreadsheets__test__home spreadsheets__test__core; do
          if [ -z "${!name}" ]; then
            echo "::warning::$name is empty - the integration tests that need it will skip."
            missing=$((missing + 1))
          else
            echo "present: $name"
          fi
        done
        echo "$missing of 9 integration-test settings are missing."

    - name: Run Tests
      shell: bash
      env:
        spreadsheets__test__gig: ${{ secrets.GIG_SPREADSHEET_ID }}
        spreadsheets__test__stock: ${{ secrets.STOCK_SPREADSHEET_ID }}
        spreadsheets__test__job: ${{ secrets.JOB_SPREADSHEET_ID }}
        spreadsheets__test__home: ${{ secrets.HOME_SPREADSHEET_ID }}
        spreadsheets__test__core: ${{ secrets.CORE_SPREADSHEET_ID }}
        google_credentials__private_key_id: ${{ secrets.GOOGLE_CREDENTIALS_PRIVATE_KEY_ID }}
        google_credentials__private_key: ${{ secrets.GOOGLE_CREDENTIALS_PRIVATE_KEY }}
        google_credentials__client_email: ${{ secrets.GOOGLE_CREDENTIALS_CLIENT_EMAIL }}
        google_credentials__client_id: ${{ secrets.GOOGLE_CREDENTIALS_CLIENT_ID }}
      run: |
        for i in {1..3}; do
          echo "Test attempt $i of 3"
          if dotnet test --no-build --configuration Release --logger trx --verbosity normal; then
            echo "Tests passed!"
            exit 0
          fi
          if [ $i -lt 3 ]; then
            SLEEP_TIME=$((10 * (1 << ($i - 1))))
            echo "Tests failed, retrying in $SLEEP_TIME seconds..."
            sleep $SLEEP_TIME
          fi
        done
        echo "Tests failed after 3 attempts"
        exit 1

    - name: Report skipped tests
      if: always()
      shell: bash
      run: |
        # A skipped test is not a failure, so ~100 skipped live-sheet tests look identical to a
        # clean run in the checks UI. Surface the count in the job summary so a config regression
        # is visible without reading the log. Deliberately does NOT fail the build yet: skips are
        # currently non-zero, and failing here would block every PR before the credentials that
        # cause them can be fixed. Once the count is genuinely 0, turn this into a hard failure.
        # Count individual NotExecuted results rather than reading <Counters>. VSTest records a
        # skipped test as outcome="NotExecuted" on its UnitTestResult, but does NOT propagate it
        # into the Counters element - a run with 1 skip still writes notExecuted="0", so both
        # `skipped=` (which is not a TRX attribute at all) and `notExecuted=` report zero. Verified
        # against a real TRX: total="622" executed="621" notExecuted="0" for a run with 1 skip.
        #
        # find -exec, not $(find) in argument position: with no .trx files the command substitution
        # expands to nothing and grep reads stdin instead, hanging the step. This runs
        # `if: always()`, so a build that failed before tests is exactly that case.
        skipped=$(find . -name '*.trx' -exec grep -o 'outcome="NotExecuted"' {} + 2>/dev/null | wc -l)
        skipped=${skipped:-0}
        {
          echo "## Test skips"
          echo ""
          if [ "$skipped" -eq 0 ]; then
            echo "No tests skipped."
          else
            echo "**$skipped test(s) skipped.** Integration tests skip themselves when credentials"
            echo "or a spreadsheet id are missing, so a non-zero count here means live-sheet"
            echo "coverage did not run - see the \"Check integration test config\" step above."
          fi
        } >> $GITHUB_STEP_SUMMARY
        if [ "$skipped" -ne 0 ]; then
          echo "::warning::$skipped test(s) skipped - live-sheet coverage did not run."
        fi

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/*.trx'
        retention-days: 30

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarCloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@v4
      with:
        path: ./.sonar/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarCloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ./.sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarCloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: bash
      run: |
        ./.sonar/scanner/dotnet-sonarscanner begin \
          /k:"khanjal_RaptorSheets" \
          /o:"ironraptor" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
          /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx" \
          /d:sonar.cpd.exclusions=RaptorSheets.Gig/Entities/**/*.cs \
          /d:sonar.exclusions=RaptorSheets.Core/Entities/Generated/**,RaptorSheets.Gig/Entities/Generated/**,RaptorSheets.Stock/Entities/Generated/**,**/coverage*.xml,**/TestResults/**,**/coverage/**,**/*.coverage \
          /d:sonar.coverage.exclusions=RaptorSheets.Sample.Web/**,assets/**

    - name: Build for SonarCloud
      run: dotnet build --configuration Release

    - name: Test with Coverage for SonarCloud
      shell: bash
      env:
        spreadsheets__test__gig: ${{ secrets.GIG_SPREADSHEET_ID }}
        spreadsheets__test__stock: ${{ secrets.STOCK_SPREADSHEET_ID }}
        spreadsheets__test__job: ${{ secrets.JOB_SPREADSHEET_ID }}
        spreadsheets__test__home: ${{ secrets.HOME_SPREADSHEET_ID }}
        spreadsheets__test__core: ${{ secrets.CORE_SPREADSHEET_ID }}
        google_credentials__private_key_id: ${{ secrets.GOOGLE_CREDENTIALS_PRIVATE_KEY_ID }}
        google_credentials__private_key: ${{ secrets.GOOGLE_CREDENTIALS_PRIVATE_KEY }}
        google_credentials__client_email: ${{ secrets.GOOGLE_CREDENTIALS_CLIENT_EMAIL }}
        google_credentials__client_id: ${{ secrets.GOOGLE_CREDENTIALS_CLIENT_ID }}
      run: |
        for i in {1..3}; do
          echo "Test attempt $i of 3"
          if dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger trx \
            --verbosity normal \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover; then
            echo "Tests passed!"
            exit 0
          fi
          if [ $i -lt 3 ]; then
            SLEEP_TIME=$((10 * (1 << ($i - 1))))
            echo "Tests failed, retrying in $SLEEP_TIME seconds..."
            sleep $SLEEP_TIME
          fi
        done
        echo "Tests failed after 3 attempts"
        exit 1

    - name: Upload Coverage Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-results
        path: '**/TestResults/**/coverage.opencover.xml'
        retention-days: 30

    - name: End SonarCloud Scan
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: bash
      run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
